name: Build release ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Actions épinglées par SHA (supply-chain) : checkout v7.0.1 (Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run standalone unit tests
        run: php tests/unit-tests.php

      - name: Official KoSIT validation (EN16931 + XRechnung)
        # Validateur officiel de la KoSIT (Java préinstallé sur ubuntu-latest) sur
        # tous les XML jugés conformes par les tests unitaires. Bundle téléchargé
        # depuis projekte.kosit.org, intégrité vérifiée par SHA-256 (cf. script).
        run: bash tests/kosit-validate.sh

      - name: Build clean ZIP (dossier racine = auvoerechnung/, nom Dolistore module_<nom>-x.y.z.zip)
        run: |
          # Dolistore exige le format de makepack : module_<nom>-x.y(.z).zip
          # (préfixe module_, version SANS le « v » du tag). Cf. regex du shop
          # (module|moduleXxx|theme|website)_mypackagename-x.y(.z).zip
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/build/auvoerechnung
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='*.md.bak' \
            --exclude='/tests' \
            --exclude='/demo' \
            ./ /tmp/build/auvoerechnung/
          cd /tmp/build && zip -r "/tmp/module_auvoerechnung-${VERSION}.zip" auvoerechnung/
          unzip -l "/tmp/module_auvoerechnung-${VERSION}.zip" | head -20

      - name: Attach ZIP to release
        # softprops/action-gh-release v3.0.3 épinglée par SHA (Node 24)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: /tmp/module_auvoerechnung-*.zip
          fail_on_unmatched_files: true
